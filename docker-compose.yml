version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sketch_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - sketch-net

  webserver:
    image: nginx:alpine
    container_name: sketch_webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - sketch-net

  db:
    image: postgis/postgis:16-3.4
    container_name: sketch_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sketch_db
      POSTGRES_USER: sketch_user
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sketch-net

  redis:
    image: redis:alpine
    container_name: sketch_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - sketch-net

networks:
  sketch-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
